async function walletQuote(s,m){let j=await yahoo('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(s)+'?range=1mo&interval=1d'),a=j.chart.result[0];if(m==='sa'?a.meta.currency!=='SAR':!['NMS','NGM','NCM','NAS'].includes(a.meta.exchangeName)||a.meta.currency!=='USD')throw Error('السوق غير مطابق');let q=a.indicators.quote[0].close,k=q.findLastIndex(Number.isFinite);if(k<0||q[k]<=0)throw Error('لا يوجد سعر');return {price:q[k],name:a.meta.longName||a.meta.shortName||s,date:new Date(a.timestamp[k]*1000).toLocaleDateString('ar-SA')}}

const saCorrections={'4291':'الوطنية للتعليم','4292':'عطاء','6004':'كاتريون','6013':'التنمية الغذائية','6014':'الآمار','6015':'أمريكانا','6016':'برغرايزر','6017':'جاهز','6018':'الأندية الرياضية','7204':'المعمر لأنظمة المعلومات','7211':'عزم'};function stockLabel(r){let sym=String(r.symbol||'').toUpperCase(),code=sym.replace(/\.SR$/,'');let m=r.market||(sym.endsWith('.SR')||/^\d+$/.test(sym)?'sa':'us');if(m==='us')return sym;let arabic=n=>typeof n==='string'&&/[\u0600-\u06ff]/.test(n);let n=saCorrections[code]||embeddedCompanies.sa.find(x=>x.symbol===code+'.SR'&&arabic(x.name))?.name||(arabic(r.name)?r.name:'');return n?n+' — '+code:code}function localCompanies(m){if(m==='us')return embeddedCompanies.us.slice();const rows=new Map(embeddedCompanies[m].map(x=>[x.symbol,x]));for(const x of state.companyCache?.[m]?.rows||[])if(!rows.has(x.symbol)||rows.get(x.symbol).name===x.symbol.replace(/\.SR$/,''))rows.set(x.symbol,x);for(const [code,name] of Object.entries(saCorrections)){let symbol=code+'.SR';rows.set(symbol,{...rows.get(symbol),symbol,name,market:'sa'})}return [...rows.values()].sort((a,b)=>a.symbol.localeCompare(b.symbol,'en',{numeric:true}));}

function scanner(){scanMarket=market;scanRows=scanJobs[scanMarket]?.rows||[];scanUniverse=localCompanies(scanMarket);$('content').innerHTML=`<section class="scan"><h3>⌗ الماسح الشامل</h3><div>السوق: ${marketName(market)} — السهم: لم يحلل</div><h3>AZIZ — أفضل فرص السوق</h3><small>الفحص الفني فقط، دون أخبار أو نتائج مالية • شموع يومية من Yahoo Finance</small><h3>تجهيز الرموز للفحص</h3><button id="prepareBtn" onclick="prepareUniverse()">تجهيز الرموز للفحص</button><button onclick="prepareUniverse()">تحديث قائمة الشركات</button><small id="universeStatus">${scanUniverse.length} رمزًا جاهزًا من القائمة المحفوظة</small><h3>الفترة الزمنية</h3><div class="periods">${[21,30,60,90].map((d,i)=>`<button onclick="setPeriod(${d})" data-days="${d}">${['3 أسابيع','شهر','شهرين','3 أشهر'][i]}</button>`).join('')}</div><div id="scanStatus">لم يبدأ الفحص</div><progress id="scanProgress" value="0" max="1"></progress><div class="scanActions"><button onclick="runScan()">ابدأ الفحص</button><button onclick="showUniverse()">قائمة الشركات</button><button onclick="stopScan()">إيقاف</button></div><div id="universeList"></div><div id="scanResults"></div></section>`;setPeriod(scanPeriod);paintScan(scanMarket);prepareUniverse()}

async function yahoo(url,options={}){const u=new URL(url);if(u.pathname.startsWith('/v8/finance/chart/')){const symbol=decodeURIComponent(u.pathname.split('/').pop());url='https://aziz-yahoo.azizaljohne.workers.dev/?symbol='+encodeURIComponent(symbol);}let r=await fetch(url,{...options,cache:'no-store',signal:AbortSignal.timeout(18000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function fetchCompanies(m){if(m==='us')return embeddedCompanies.us.slice();const url='https://aziz-stocks-symbols.azizaljohne.workers.dev/?market='+encodeURIComponent(m);const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(60000)});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error||!Array.isArray(j.symbols)||j.market!==m)throw Error(j.error||'استجابة قائمة غير صالحة');const rows=[...new Map(j.symbols.map(x=>{let symbol=String(x.symbol||'').trim().toUpperCase();if(m==='sa'&&/^\d+$/.test(symbol))symbol+='.SR';return {symbol,name:embeddedCompanies[m].find(z=>z.symbol===symbol&&z.name!==symbol.replace(/\.SR$/,''))?.name||String(x.name||symbol),market:m}}).filter(x=>m==='sa'?/^\d+\.SR$/.test(x.symbol):/^[A-Z][A-Z0-9.\-]*$/.test(x.symbol)).map(x=>[x.symbol,x])).values()].sort((a,b)=>a.symbol.localeCompare(b.symbol,'en',{numeric:true}));if(!rows.length||rows.length<100)throw Error('قائمة السوق غير مكتملة');state.companyCache??={};state.companyCache[m]={rows,updated:Date.now()};save();return rows}

const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;function ema(a,n){return a.reduce((v,x,i)=>i?v+(x-v)*2/(n+1):x,0)}

const azSymbol=(s,m)=>m==='sa'?s.replace(/\.SR$/i,'')+'.SR':s;
const azDate=s=>s?Date.parse(s.replace(' ','T')+(s.endsWith('Z')?'':'Z')):null;
async function azMutation(path,body,msg){if(azSending)return;azSending=true;try{await azCall(path,body);$('walletOrder')?.remove();notify(msg);await walletRefresh()}catch(e){notify(e.message+' — حدّث المحفظة للتحقق قبل إعادة المحاولة')}finally{azSending=false}}
async function walletRefresh(){if(walletBusy)return;walletBusy=true;try{await azCall('/wallet');let d=await azCall('/portfolio');if(!d.balance)throw Error('الرصيد غير متاح');let old=new Map(state.positions.map(r=>[r.market+':'+r.symbol,r]));azBalance=d.balance;state.cash=d.balance.cash_cents/100;state.positions=d.positions.map(r=>{let symbol=azSymbol(r.symbol,r.market),prev=old.get(r.market+':'+symbol);return {symbol,market:r.market,q:r.quantity,price:r.cost_cents/100/r.quantity,last:prev?.last,lastDate:prev?.lastDate}});let orders=new Map(d.orders.map(o=>[o.id,o]));let row=o=>({id:o.id,symbol:azSymbol(o.symbol,o.market),market:o.market,side:o.side,type:o.side==='buy'?'شراء':'بيع',q:o.quantity,limit:o.limit_price_cents==null?undefined:o.limit_price_cents/100,created:azDate(o.created_at),status:o.status});state.walletPending=d.orders.filter(o=>o.status==='pending').map(row);let sales=d.trades.map(t=>({...row(orders.get(t.order_id)),id:t.order_id,price:t.price_cents/100/fx(t.market),pnl:t.side==='sell'?t.profit_usd_cents/100:undefined,created:azDate(t.created_at),status:'filled'}));state.walletSales=sales.filter(r=>r.type==='بيع');state.history=[...sales,...d.orders.filter(o=>o.status==='cancelled').map(row)].filter(r=>!(state.azHiddenOrders||[]).includes(r.id)).sort((a,b)=>b.created-a.created);state.walletUpdated=Date.now();if($('walletStatus')&&!$('walletOrder')&&!$('page').hidden){walletRender();$('walletStatus').textContent='متصل بالسيرفر • آخر تحديث: '+new Date().toLocaleString('ar-SA')}let fail=0;for(let r of state.positions){try{let a=await walletQuote(r.symbol,r.market);r.last=a.price/fx(r.market);r.lastDate=a.date}catch{fail++}}walletSnapshot();if($('walletStatus')&&!$('walletOrder')&&!$('page').hidden){walletRender();$('walletStatus').textContent='متصل بالسيرفر • تعذر تحديث أسعار '+fail}}catch(e){if($('walletStatus'))$('walletStatus').textContent='تعذر المزامنة: '+e.message;notify(e.message)}finally{walletBusy=false}}

let azAutoBusy=false;async function azAutoRefresh(){if(azAutoBusy||document.hidden||!document.documentElement.classList.contains('az-open'))return;azAutoBusy=true;try{await walletRefresh();await refreshEye();await guardRefresh();if(!$('page').hidden){if(activePage===1&&$('symbol')?.value)await quote();if(activePage===3)await refreshAlerts();if(activePage===5)await refreshRecs();if(activePage===9&&$('rbStatus'))await rbScan();if(activePage===10&&$('smartRoot'))await smScan();if(activePage===11)await memRefresh()}}finally{azAutoBusy=false}}
setInterval(azAutoRefresh,900000);
setInterval(()=>{if(!document.hidden&&activePage===12&&!$('page').hidden&&!$('walletOrder')&&document.documentElement.classList.contains('az-open'))walletRefresh()},60000);


/* إضافات مستقلة: لا تعدل وظائف المحفظة أو الماسح */
const azExtraNames=['قناص نقطة الدخول','عقل عزيز الذكي'];
const azExtraTiles=document.createElement('div');azExtraTiles.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px';
azExtraNames.forEach((n,i)=>{let b=document.createElement('button');b.className='tile';b.style.gridColumn='auto';b.textContent=(i?'🧠 ':'🎯 ')+n;b.onclick=()=>azExtraPage(i);azExtraTiles.append(b)});$('tiles').after(azExtraTiles);
function azExtraPage(i){activePage=13+i;$('homePanel').hidden=true;$('page').hidden=false;$('page').innerHTML=`<nav class="pageNav"><button onclick="home()">‹ رجوع</button><h2>${azExtraNames[i]}</h2><button onclick="home()">🏠 الرئيسية</button></nav><section><select id="azXM"><option value="sa">السعودية</option><option value="us">ناسداك</option></select><input id="azXS" placeholder="رمز السهم"><button id="azXB">فحص</button><p id="azXR">البيانات يومية وليست لحظية.</p></section>`;$('azXM').value=market;$('azXB').onclick=()=>azExtraRun(i)}
function azXRows(a){let q=a.indicators.quote[0];return a.timestamp.map((t,i)=>({t,o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i],v:q.volume[i]})).filter(x=>[x.o,x.h,x.l,x.c,x.v].every(Number.isFinite)&&x.l>0&&x.h>=x.l&&x.c>0&&x.v>=0).sort((a,b)=>a.t-b.t)}
function azXSetup(r){if(r.length<200)throw Error('بيانات غير كافية');let c=r.map(x=>x.c),x=r.at(-1),prev=r.slice(-21,-1),p=x.c,atr=avg(r.slice(-14).map((z,i)=>{let y=r[r.length-15+i];return Math.max(z.h-z.l,Math.abs(z.h-y.c),Math.abs(z.l-y.c))})),support=Math.min(...prev.map(z=>z.l)),res=Math.max(...prev.map(z=>z.h)),stop=Math.max(support-atr*.1,p-atr*1.5),risk=p-stop,rr=risk>0?(res-p)/risk:0,rv=x.v/Math.max(1,avg(prev.map(z=>z.v))),flow=r.slice(-20),vol=flow.reduce((s,z)=>s+z.v,0),cmf=vol?flow.reduce((s,z)=>s+(z.h===z.l?0:(2*z.c-z.h-z.l)/(z.h-z.l)*z.v),0)/vol:0,trend=p>ema(c,20)&&ema(c,20)>ema(c,50),near=p<=ema(c,20)+atr,ok=trend&&cmf>0&&rv>=1&&near&&rr>=2&&risk>0&&atr/p<=.08;return {p,stop,res,rr,rv,cmf,trend,near,ok,atr}}
function azXTest(r){let wins=0,losses=0,timeouts=0,n=0;for(let i=199;i+5<r.length;i++){let a=azXSetup(r.slice(0,i+1));if(!a.ok)continue;let entry=r[i+1].o;if(entry<=a.stop||entry>=a.res||(a.res-entry)/(entry-a.stop)<2)continue;n++;let outcome=0;for(let j=i+1;j<=i+5;j++){let z=r[j];if(z.l<=a.stop){outcome=-1;break}if(z.h>=a.res){outcome=1;break}}if(outcome===1)wins++;else if(outcome===-1)losses++;else timeouts++;i+=5}return {n,wins,losses,timeouts,rate:n?wins/n:null}}
async function azExtraRun(i){let out=$('azXR'),b=$('azXB'),m=$('azXM').value,s=$('azXS').value.trim().toUpperCase();if(m==='sa'){s=s.replace(/\.SR$/,'');if(!/^\d{4,6}$/.test(s)){out.textContent='رمز غير صالح';return}s+='.SR'}else if(!/^[A-Z0-9.-]{1,15}$/.test(s)){out.textContent='رمز غير صالح';return}b.disabled=true;out.textContent='جارٍ جلب البيانات…';try{let j=await yahoo('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(s)+'?range=2y&interval=1d'),a=j.chart.result[0];if(m==='us'&&!['NMS','NGM','NCM','NAS'].includes(a.meta.exchangeName))throw Error('خارج ناسداك');let r=azXRows(a);if(r.at(-1)?.t>Date.now()/1000-86400)r.pop();let z=azXSetup(r),f=x=>Number.isFinite(x)?x.toFixed(2):'—',u=m==='sa'?'ريال':'دولار';if(i===0){out.innerHTML=`<b>${esc(s)} — ${z.ok?'اجتاز الفلتر التجريبي':'انتظار'}</b><br>آخر إغلاق: ${f(z.p)} ${u}<br>وقف مقترح: ${f(z.stop)}<br>المقاومة: ${f(z.res)}<br>العائد/المخاطرة: ${f(z.rr)}<br>CMF: ${f(z.cmf)} • RVOL: ${f(z.rv)}<br>الاتجاه: ${z.trend?'إيجابي':'غير مؤكد'}<br>الدخول: ${z.near?'قريب من المتوسط':'بعيد عن المتوسط'}<br>آخر شمعة: ${new Date(r.at(-1).t*1000).toLocaleDateString('ar-SA')}<br>فلتر تجريبي وليس توصية أو سعر تنفيذ.`}else{let t=azXTest(r);out.innerHTML=`<b>${esc(s)} — اختبار تاريخي تجريبي</b><br>عدد الشموع: ${r.length}<br>الصفقات: ${t.n}<br>بلغت الهدف: ${t.wins}<br>بلغت الوقف: ${t.losses}<br>انتهت المهلة: ${t.timeouts}<br>نسبة بلوغ الهدف: ${t.rate===null?'لا توجد عينة':f(t.rate*100)+'٪'}<br>الدخول في افتتاح الجلسة التالية؛ مهلة 5 جلسات؛ الوقف أولاً عند اجتماع الهدف والوقف في شمعة واحدة.<br>لا تشمل الرسوم والانزلاق. ليست احتمالية نجاح مستقبلية ولا اختباراً مستقلاً. ${t.n<100?'العينة غير كافية.':''}<br>محرك السيرفر وخمس سنوات من البيانات غير متاحين بعد.`}}catch(e){out.textContent='تعذر الفحص: '+e.message}finally{b.disabled=false}}
</script></html>
