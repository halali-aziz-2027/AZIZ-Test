<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عزيز ٢</title><style> *{box-sizing:border-box}body{margin:0;background:#080f20;color:#e2e8f0;font:16px system-ui}main{max-width:1100px;margin:auto;padding:18px}header{text-align:center;padding:25px}h1,h2,h3{color:#38bdf8}button,input,select{font:inherit;border:1px solid #315575;border-radius:12px;padding:12px;color:inherit;background:#142238}button{cursor:pointer}button:hover,button.active{background:#0284c7} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#101e34;border:1px solid #24496b;border-radius:18px;padding:16px;margin:8px 0}.nav button{min-height:80px}.wide{width:100%;background:#0284c7;margin:12px 0}.muted{color:#94a3b8}.good{color:#4ade80}.bad{color:#f87171}.warn{color:#facc15}.bar{background:#20334b;height:8px;border-radius:9px;overflow:hidden}.bar i{display:block;background:#38bdf8;height:100%}.circle{border:7px solid #38bdf8;border-radius:50%;width:100px;height:100px;display:grid;place-content:center;font-size:25px;float:left}.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #20334b}small{color:#94a3b8}svg{width:100%;height:110px} @media(max-width:600px){.results{grid-template-columns:1fr}main{padding:10px}}</style><main><header><div style="font-size:48px;color:#38bdf8">◎</div><h1>عزيز ٢ | AZIZ 2</h1><div>القناص الذكي للأسهم • برنامج سعودي</div><small>نسخة تطوير — لا توجد بيانات تجريبية</small></header><div class="grid"><button onclick="market='sa';refresh()">🇸🇦 السوق السعودي</button><button onclick="market='us';refresh()">🇺🇸 ناسداك</button></div><div class="grid" style="margin-top:12px"><button onclick="band='penny';scan()">أسهم السنتات — أقل من $1</button><button onclick="band='cheap';scan()">$1 إلى أقل من $5</button><button onclick="band='mid';scan()">$5 إلى $10</button><button onclick="band='all';scan()">جميع الفئات</button></div><button class="wide" onclick="scan()">◉ الماسح الشامل</button><div class="grid nav" id="nav"></div><section class="card"><h2 id="heading">حالة الاتصال</h2><div id="status" class="warn">لم يتم ربط السيرفر بعد</div><div class="grid" id="counts"></div><div class="bar"><i id="progress" style="width:0%"></i></div><p><input id="symbol" placeholder="رمز السهم"><button onclick="analyze()">تحليل</button> <button onclick="stop()">إيقاف الماسح</button></p><div id="results" class="grid results"></div></section><footer class="muted">درجة الترشيح ليست احتمال نجاح أو ضمانًا للصعود.</footer></main><script>
let market='us',band='all',timer;const $=id=>document.getElementById(id);const names=['ماسح السنتات','أفضل 10 فرص','قناص الدخول','الفحص الذهبي','رادار التجميع','تحليل السهم','صائد الارتداد','التنبيهات الذكية','سجل التوصيات','حارس الصفقة','المفضلة','المحفظة الوهمية','ماسح الشموع الذكي','ذاكرة عزيز ٢','غرفة التأكيد النهائي'];const icons=['◉','♜','◎','◇','◈','▥','↗','♧','▤','⛨','♡','▣','▥','◷','✓'];names.forEach((n,i)=>{let b=document.createElement('button');b.innerHTML=`<span style="color:#38bdf8;font-size:26px">${icons[i]}</span><br>${n}`;b.onclick=()=>{ $('heading').textContent=n;if(i===0){market='us';band='penny';scan()}else if(i===1)refresh(true);else if(i===5)$('symbol').focus();else if(i===10)favorites();else {$('results').replaceChildren();$('status').textContent='هذه الوظيفة قيد التطوير في هذه النسخة';}};$('nav').append(b)});async function api(p,opt){let r=await fetch('/aziz2/api/'+p,opt);if(!r.ok)throw Error('تعذر الاتصال أو جلب البيانات');return r.json()}function err(e){$('status').textContent=e.message}async function scan(){try{await api('scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({market,band})});refresh();clearInterval(timer);timer=setInterval(refresh,3000)}catch(e){err(e)}}async function stop(){try{await api('stop',{method:'POST'});refresh()}catch(e){err(e)}}async function refresh(top=false){try{let d=await api('status?market='+market);$('status').textContent=d.message;$('counts').innerHTML=['total','done','failed','eligible'].map((k,i)=>`<div class="card">${['إجمالي الرموز','المفحوصة','تعذر الفحص','المؤهلة سعريًا'][i]}<h2>${d[k]}</h2></div>`).join('');$('progress').style.width=(d.total?100*d.done/d.total:0)+'%';render(top===true?d.results.slice(0,10):d.results)}catch(e){err(e)}}async function analyze(){try{render([await api('analyze?market='+market+'&symbol='+encodeURIComponent($('symbol').value))]);$('status').textContent='تم جلب التحليل'}catch(e){err(e)}}function esc(x){return String(x??'غير متاح').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(rows){$('results').innerHTML=rows.map(r=>`<article class="card"><div class="circle">${esc(r.score)}%</div><h3>${esc(r.symbol)} ${esc(r.name||'')}</h3><h2>${esc(r.price)} ${r.market==='sa'?'ر.س':'$'}</h2><p class="warn">${esc(r.signal)}</p><small>${esc(r.date)}</small><div style="clear:both"></div><p>إيجابي ${r.positive} • سلبي ${r.negative} • غير متاح ${r.missing}</p>${(r.groups||[]).map(g=>`<div class="line">${esc(g.name)} <b>${esc(g.score)}%</b></div><div class="bar"><i style="width:${Number(g.score)||0}%"></i></div>`).join('')}<p>الدعوم: ${esc(r.supports?.join(' / '))}</p><p>المقاومات: ${esc(r.resistances?.join(' / '))}</p><details><summary>المؤشرات والتفاصيل</summary>${r.checks.map(c=>`<div class="line"><span>${esc(c.name)}</span><span class="${c.ok===true?'good':c.ok===false?'bad':'warn'}">${esc(c.value)}</span></div>`).join('')}</details><button onclick="save('${esc(r.symbol)}','${r.market}')">♡ حفظ</button></article>`).join('')}function save(s,m){let a=JSON.parse(localStorage.aziz2fav||'[]');if(!a.some(x=>x.s===s&&x.m===m))a.push({s,m});localStorage.aziz2fav=JSON.stringify(a)}function favorites(){$('results').innerHTML=JSON.parse(localStorage.aziz2fav||'[]').map(x=>`<div class="card">${esc(x.s)} — ${esc(x.m)}</div>`).join('')}refresh();</script></html>
