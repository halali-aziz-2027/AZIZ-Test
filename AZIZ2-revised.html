analyze=function(a,s,m,n){let z=originalAnalyze(a,s,m,n),r=z.r,p=z.p,x=r.at(-1),y=r.at(-2),atr=z.base.metrics.atr,vol=z.base.metrics.rvol,flow=z.items.find(i=>i.n==='CMF').v,prev=r.slice(-21,-1),top=Math.max(...prev.map(t=>t.h)),bottom=Math.min(...prev.map(t=>t.l)),stop=z.supports[0]?z.supports[0]-atr*.25:p-atr*1.5,risk=p-stop,targets=[p+risk*2,p+risk*3,p+risk*4],rr=risk>0?(targets[0]-p)/risk:0,age=(Date.now()/1000-x.t)/86400,gate=age<=7&&atr/p<=.08&&stop>0&&risk>0&&rr>=2-1e-9&&x.v>0&&p*x.v>=100000;let compression=atr/p<.035,acc=flow>0&&z.base.metrics.obv>0&&compression,dist=flow<0&&z.base.metrics.obv<0;let groups=z.groups;return {...z,stop,targets,rr,gate,age,patterns:patterns(r),systems:[['التجميع',acc?'تجميع محتمل':'غير مؤكد'],['التصريف',dist?'ضغط تصريف':'غير مؤكد'],['الانفجار السعري',compression&&vol>1.5?'ضغط سعري وحجم مرتفع':'انتظار'],['الاختراق الوهمي',x.h>top&&x.c<top?'اختراق علوي فاشل':'غير مرصود'],['الفجوة',((x.o/y.c-1)*100).toFixed(2)+'%'],['توقيت الدخول',gate&&z.score>=85?'مرشح للفحص':'انتظار'],['النموذج الفني',x.c>top?'اختراق نطاق':x.c<bottom?'كسر نطاق':'داخل نطاق'],['القوة النسبية للسوق والقطاع','غير متاحة'],['مخاطر التخفيف والإيقاف والشطب','غير متاحة'],['تأكيد الفواصل الخمسة','لم يتم التحقق']]}};
const oldCard=card;card=function(z,i){let h=oldCard(z,i);if(!z.systems)return h;let counts=[1,-1,0].map(k=>z.items.filter(t=>t.s===k&&!(typeof t.v==='number'&&!Number.isFinite(t.v))).length);return h.replace('</h3>','</h3>'+`<div style="margin:auto;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#38bdf8 ${z.score}%,#23354c 0)"><strong style="background:#101e34;border-radius:50%;padding:22px">${z.score}%</strong></div><p>إيجابي ${counts[0]} | سلبي ${counts[1]} | محايد ${counts[2]} | غير متاح ${z.items.length-counts.reduce((a,b)=>a+b,0)}</p>${z.groups.map(g=>`<p>${g.g} ${fmt(g.score)}<progress max="100" value="${g.score||0}"></progress></p>`).join('')}<p>دخول مرجعي ${fmt(z.p)} | وقف ${fmt(z.stop)} | أهداف ${z.targets.map(fmt).join(' / ')} | عائد/مخاطرة ${fmt(z.rr)}</p><p>بوابة المخاطر الأولية: ${z.gate?'اجتاز الشروط السعرية والحجم':'انتظار'} — ليست موافقة نهائية</p><p>نماذج الشموع: ${z.patterns.map(t=>esc(t[0])).join('، ')||'لا نموذج مرصود'}</p>${z.systems.map(t=>`<p>${esc(t[0])}: ${esc(t[1])}</p>`).join('')}<button onclick="rememberSignal(${i})">حفظ إشارة للمراجعة</button><button onclick="frames(${i})">فحص الفواصل الخمسة</button><div id="frames-${i}"></div>`)};
async function frames(i){let z=results[i],el=$('frames-'+i);if(!el)return;el.textContent='جلب الفواصل';let out=[];for(let [interval,range] of [['5m','5d'],['15m','1mo'],['60m','3mo'],['1d','1y'],['1wk','5y']]){try{let a=await chart(z.s,interval,range);if(a.meta?.dataGranularity!==interval)throw Error('الفاصل غير مطابق');let t=originalAnalyze(a,z.s,z.m,z.n);out.push(interval+': '+t.score+'%')}catch(e){out.push(interval+': غير متاح')}}el.textContent=out.join(' | ')}
const memKey='aziz2-signals-v2';function readMem(){return JSON.parse(localStorage.getItem(memKey)||'[]')}function rememberSignal(i){let z=results[i];if(!z.targets)return;let a=readMem(),t=z.r.at(-1).t;if(!a.some(x=>x.s===z.s&&x.t===t)){a.push({s:z.s,m:z.m,t,p:z.p,stop:z.stop,targets:z.targets,score:z.score});localStorage.setItem(memKey,JSON.stringify(a))}$('status').textContent='حفظت الإشارة للمراجعة'}function memoryView(){let a=readMem();$('out').innerHTML=a.map(x=>`<article>${esc(x.s)} | ${fmt(x.p)} | ${x.score}%<p>${esc(x.review||'بانتظار المتابعة')}</p></article>`).join('')||'لا إشارات محفوظة'}async function reviewMemory(){let a=readMem();for(let x of a){try{let d=await chart(x.s),q=d.indicators.quote[0],rows=d.timestamp.map((t,i)=>({t,h:q.high[i],l:q.low[i],c:q.close[i]})).filter(t=>t.t>x.t&&Number.isFinite(t.c)&&Number.isFinite(t.h)&&Number.isFinite(t.l));let first='لم يتحقق';for(let t of rows){if(t.l<=x.stop&&t.h>=x.targets[0]){first='ترتيب الهدف والوقف غير معلوم داخل الشمعة';break}if(t.l<=x.stop){first='وقف';break}if(t.h>=x.targets[0]){first='هدف أول';break}}x.review=first+' | '+[1,3,5,10,20].map(n=>n+' جلسة: '+(rows[n-1]?fmt(100*(rows[n-1].c/x.p-1))+'%':'انتظار')).join(' | ')}catch(e){x.review='تعذر التحديث'}}localStorage.setItem(memKey,JSON.stringify(a));memoryView()}
const enhancedAnalyze=analyze;
function chartShapes(r){const a=r.slice(-90), lows=[], highs=[];for(let i=2;i<a.length-2;i++){if(a.slice(i-2,i+3).every(x=>x.l>=a[i].l))lows.push({i,p:a[i].l});if(a.slice(i-2,i+3).every(x=>x.h<=a[i].h))highs.push({i,p:a[i].h});}const near=(a,b)=>Math.abs(a-b)/Math.max(a,b)<=.025, out=[];let l=lows.slice(-3),h=highs.slice(-3),p=a.at(-1).c;if(l.length>=2&&near(l.at(-1).p,l.at(-2).p)&&l.at(-1).i-l.at(-2).i>=5)out.push('قاع مزدوج محتمل W');if(l.length===3&&l.every(x=>near(x.p,l[0].p)))out.push('قاع ثلاثي محتمل');if(h.length===3&&h.every(x=>near(x.p,h[0].p))&&l.length===3&&l[0].p<l[1].p&&l[1].p<l[2].p)out.push('مثلث صاعد محتمل');if(l.length===3&&l[1].p<l[0].p*.97&&near(l[0].p,l[2].p))out.push('رأس وكتفان معكوس محتمل');if(h.length===3&&l.length===3&&h[0].p>h[2].p&&l[0].p>l[2].p&&(h[0].p-l[0].p)>(h[2].p-l[2].p)*1.4)out.push('وتد هابط محتمل');if(h.length===3&&l.length===3&&h.every(x=>near(x.p,h[0].p))&&l.every(x=>near(x.p,l[0].p)))out.push('مستطيل تجميع محتمل');let early=a.slice(-30,-10),late=a.slice(-10),gain=early.at(-1).c/early[0].c-1;if(gain>.12&&late.at(-1).c<early.at(-1).c&&late.at(-1).c>early[0].c*(1+gain*.5))out.push('علم صاعد محتمل');if(a.length>=60){let left=a.slice(0,20),mid=a.slice(20,50),right=a.slice(50,70),handle=a.slice(70);if(near(left[0].c,right.at(-1).c)&&Math.min(...mid.map(x=>x.l))<left[0].c*.9&&handle.length&&Math.min(...handle.map(x=>x.l))>Math.min(...mid.map(x=>x.l))&&p>=right.at(-1).c*.97)out.push('كوب وعروة محتمل');}return out;}
analyze=function(a,s,m,n){let z=enhancedAnalyze(a,s,m,n);z.shapes=chartShapes(z.r);let r=z.r.slice(-20),up=r.filter((x,i)=>i&&x.c>r[i-1].c),dn=r.filter((x,i)=>i&&x.c<r[i-1].c);z.accumulation=up.length&&dn.length?avg(up.map(x=>x.v))>avg(dn.map(x=>x.v))&&Math.min(...r.slice(-10).map(x=>x.l))>Math.min(...r.slice(0,10).map(x=>x.l)):false;return z};
const enhancedCard=card;
card=function(z,i){return enhancedCard(z,i).replace('</article>',`<p>النماذج المحتملة: ${esc((z.shapes||[]).join('، ')||'لا نموذج مرصود')}</p><p>تجميع بالحجم والقيعان: ${z.accumulation?'مرصود':'غير مؤكد'}</p><button onclick="confirmSeven(${i})">غرفة التأكيد النهائي</button><div id="confirm-${i}"></div></article>`)};
async function confirmSeven(i){let z=results[i],el=$('confirm-'+i);if(!z||!el)return;el.textContent='جلب بيانات التأكيد';let f=[];for(let [interval,range] of [['5m','5d'],['15m','1mo'],['60m','3mo'],['1d','1y'],['1wk','5y']]){try{let a=await chart(z.s,interval,range);if(a.meta?.dataGranularity!==interval)throw Error();let t=originalAnalyze(a,z.s,z.m,z.n);f.push(t.score)}catch(e){f.push(null)}}let checks=[['المؤشرات',z.score>=85],['السيولة والتجميع',!!z.accumulation],['الاتجاه والزخم',z.groups.filter(g=>['اتجاه','زخم'].includes(g.g)).every(g=>g.score>=70)],['الفواصل الخمسة',f.includes(null)?null:f.every(v=>v>=70)],['النموذج الفني',!!z.shapes?.length],['الدخول',z.rr>=2&&z.stop<z.p],['المخاطر الشاملة',z.gate?null:false]];el.innerHTML=checks.map(([n,v])=>`<p>${n}: ${v===null?'غير متاح':v?'اجتاز':'لم يجتز'}</p>`).join('')+'<p>القرار: انتظار — يلزم التحقق من المخاطر الخارجية قبل اعتماد الترشيح.</p>';}
